[package]
name = "monitor-bin"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
monitor = { path = "../monitor" }
abi = { path = "../abi" }

# Dual-target build (ruling P2-1): the default (no feature) image targets the
# QEMU `virt` machine (RAM @ 0x8000_0000, 16550 UART, sifive_test finisher),
# driven by `cargo xtask qemu`. The `sim` feature retargets the SAME sources
# to the LiteX/VexRiscv-secure SoC map (MON_CODE @ 0x1000_0000, LiteX CSR
# UART), driven by `cargo xtask verilator`. The two never build into the same
# artifact; each xtask runner passes its own linker script + rustflags.
[features]
default = []
sim = []
# V3-2: build the sim image so it overflows the M stack into the locked guard
# page after boot (the `--stack-overflow` measure sub-scenario). Implies `sim`.
stackflow = ["sim"]
# V4: build the sim image to run the U-compartment -> M `mediate` round trip on
# the Verilated SoC (`cargo xtask verilator -- mediate`). Implies `sim`.
mediate = ["sim"]

# monitor-bin is a #![no_std] #![no_main] bare-metal image for the QEMU
# `virt` machine. It is not host-buildable; see the workspace Cargo.toml
# `default-members` and `cargo xtask qemu`.
